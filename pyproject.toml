[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdetect"
version = "0.1.0"
description = "Technographic detection CLI: detect the technologies a domain uses from public HTTP and DNS signals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
techdetect = "techdetect.cli:main"

[tool.setuptools.packages.find]
include = ["techdetect*"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: tests that hit the real network (deselected by default)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
